# defaults/html.yaml — Markdown (GFM) → HTML autonome (une seule page, ressources incluses)
# Usage : pandoc -d defaults/html.yaml fichier.md -o sortie/fichier.html
from: gfm
to: html5
standalone: true
embed-resources: true
css:
  - templates/style.css
filters:
  - filters/alertes.lua
  - filters/mermaid.lua
resource-path:
  - .
  - exemples
toc: true
toc-depth: 3
# Formules : MathML natif (sans réseau, sans script) ; la méthode par défaut « plain »
# échoue sur \frac, \sqrt… et laisse le TeX brut
html-math-method:
  method: mathml
metadata:
  lang: fr
